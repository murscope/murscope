<!DOCTYPE html>
<html lang="en">
<!--
  murscope board. A static page: it loads data.js, which the collector
  wrote beside it, and renders. No server, no build step, no bundler.

  It loads nothing from the network - no font CDN, no stylesheet, no
  image. The promise is "murscope makes no network call at all", and an
  artifact that phones a font host on open would break it the first time
  anybody watched. System font stacks instead; direction B's warm
  editorial palette survives the substitution intact (ADR-0002).

  This file is ASCII (Rule 3). Every visible string arrives from the
  locale catalog inside data.js, where the Chinese values are stored as
  \uXXXX escapes.
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>murscope</title>
<style>
  :root{
    --cream:#F6F3E8; --cream-deep:#EFEADA; --cream-line:#DDD6C2;
    --ink:#241C15; --ink-soft:#5C5347;
    --yellow:#FFE01B;
    --olive:#46511D; --olive-tint:#E4E6CF;
    --ochre:#7A4E06; --ochre-tint:#F0E2C4;
    --taupe:#6B6353; --taupe-tint:#E9E4D6;
    --red:#A8281E;
    --serif:Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--cream)}
  body{font-family:var(--sans);font-size:15px;line-height:1.65;color:var(--ink);
       background:var(--cream);padding:44px 28px 88px}
  .page{max-width:1240px;margin:0 auto}
  .brand{font-family:var(--serif);font-weight:700;font-size:46px;line-height:1.05;
         display:inline-block;position:relative;padding:0 8px;z-index:0}
  .brand::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:16px;
                background:var(--yellow);z-index:-1}
  .tagline{font-family:var(--serif);font-size:18px;margin-top:12px;max-width:62ch}
  .meta{font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin-top:8px}
  .meta b{font-weight:600;color:var(--ink)}
  .tiles{display:grid;grid-template-columns:repeat(6,1fr);
         border-top:2px solid var(--ink);border-bottom:1px solid var(--cream-line);
         margin-top:30px}
  .tile{padding:16px 14px 12px;border-right:1px solid var(--cream-line)}
  .tile:last-child{border-right:none}
  .tile b{font-family:var(--serif);font-weight:700;font-size:40px;line-height:1;display:block}
  .tile.alert b{display:inline-block;padding:0 7px;background:var(--yellow)}
  .tile span{font-size:12.5px;font-weight:600;color:var(--ink-soft);display:block;margin-top:6px}
  section{margin-top:44px}
  .sec-head{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);
            padding-bottom:8px;margin-bottom:16px}
  .sec-head h2{font-family:var(--serif);font-weight:700;font-size:22px}
  .sec-head .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;
                     text-transform:uppercase;color:var(--ink-soft)}
  .table-wrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%}
  th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;
     text-transform:uppercase;color:var(--ink-soft);font-weight:600;
     padding:0 12px 8px 0;border-bottom:1px solid var(--cream-line);white-space:nowrap}
  td{vertical-align:top;padding:14px 12px 14px 0;border-bottom:1px solid var(--cream-line);
     font-size:13.5px}
  tr.miss td{background:var(--taupe-tint)}
  .pname{font-family:var(--serif);font-size:18px;font-weight:700;display:block}
  .proot{font-family:var(--mono);font-size:11px;color:var(--taupe);display:block;
         margin-top:2px;word-break:break-all;max-width:34ch}
  .chip{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
        text-transform:uppercase;padding:2px 7px;border-radius:3px;margin:3px 5px 0 0;
        background:var(--cream-deep);color:var(--ink-soft);border:1px solid var(--cream-line)}
  .chip.t-ACTIVE{background:var(--olive-tint);color:var(--olive);border-color:var(--olive)}
  .chip.t-WARM{background:var(--ochre-tint);color:var(--ochre);border-color:var(--ochre)}
  .chip.t-QUIET,.chip.t-COLD{background:var(--taupe-tint);color:var(--taupe);border-color:var(--taupe)}
  .chip.t-MISSING,.chip.q-bad{background:#F5DCD9;color:var(--red);border-color:var(--red)}
  .chip.q-degraded{background:var(--ochre-tint);color:var(--ochre);border-color:var(--ochre)}
  .num{font-family:var(--mono);font-size:12.5px;display:block;white-space:nowrap}
  .num b{font-weight:600}
  .quiet{color:var(--taupe)}
  .subject{display:block;margin-top:4px;color:var(--ink-soft);font-size:12.5px;
           max-width:36ch;line-height:1.45}
  /* The five states are told apart by shape, not by colour. A solid
     rule is a quotation from the project's own ledger; a dashed rule is
     something murscope worked out and is showing you its evidence for;
     a hairline is what you wrote; no rule at all means there is no
     claim being made. Colour stays redundant with the label. */
  .state{display:block;max-width:32ch;line-height:1.45;padding-left:10px}
  .state .body{display:block;margin-top:3px;color:var(--ink-soft);font-size:12.5px}
  .state .why{display:block;margin-top:4px;font-family:var(--mono);font-size:10.5px;
              color:var(--taupe);line-height:1.5}
  .st-declared{border-left:3px solid var(--ink)}
  .st-inferred{border-left:2px dashed var(--taupe)}
  .st-curated{border-left:1px solid var(--cream-line)}
  .st-no-source{padding-left:0;font-style:italic;color:var(--taupe)}
  .st-none{padding-left:0}
  .badge{display:inline-block;font-family:var(--mono);font-size:10px;
         letter-spacing:.1em;text-transform:lowercase;color:var(--taupe);
         border:1px dashed var(--taupe);border-radius:3px;padding:0 5px;
         margin-left:6px;vertical-align:1px}
  .owed{display:inline-block;font-family:var(--mono);font-size:10px;
        letter-spacing:.08em;background:var(--yellow);color:var(--ink);
        padding:0 5px;border-radius:2px;margin-left:6px}
  .stale{color:var(--ochre)}
  .method{margin-top:40px;padding:18px 22px;background:var(--cream-deep);
          border:1px solid var(--cream-line)}
  .method h3{font-family:var(--serif);font-size:16px;font-weight:700;margin-bottom:8px}
  .method p{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin-top:6px;
            max-width:92ch}
  .notes{background:var(--cream-deep);border:1px solid var(--cream-line);padding:16px 20px}
  .notes li{margin-left:18px;font-size:13px;color:var(--ink-soft);line-height:1.6}
  .promise{margin-top:44px;padding-top:14px;border-top:2px solid var(--ink);
           font-family:var(--mono);font-size:11.5px;color:var(--ink-soft)}
  .missing{background:var(--red);color:var(--cream);padding:0 4px}
  @media(max-width:820px){.tiles{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="page">
  <header>
    <span class="brand" id="brand">murscope</span>
    <p class="tagline" id="tagline"></p>
    <p class="meta" id="meta"></p>
  </header>
  <div class="tiles" id="tiles"></div>
  <section id="notes-section" hidden>
    <div class="sec-head"><h2 id="notes-title"></h2></div>
    <div class="notes"><ul id="notes"></ul></div>
  </section>
  <section>
    <div class="sec-head">
      <h2 id="projects-title"></h2>
      <span class="eyebrow" id="projects-count"></span>
    </div>
    <div class="table-wrap">
      <table><thead><tr id="thead"></tr></thead><tbody id="rows"></tbody></table>
    </div>
  </section>
  <section class="method" id="hints-section">
    <h3 id="hints-title"></h3>
    <div id="hints-lines"></div>
  </section>

  <section class="method" id="method-section">
    <h3 id="method-title"></h3>
    <div id="method-lines"></div>
  </section>
  <p class="promise" id="promise"></p>
</div>
<script src="data.js"></script>
<script>
(function () {
  var board = window.MURSCOPE_BOARD || {};
  var catalog = board.i18n || {};

  function t(key) {
    var value = catalog[key];
    return (typeof value === "string" && value) ? value : "[[MISSING:" + key + "]]";
  }
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) { node.className = cls; }
    if (text !== undefined && text !== null) { node.textContent = String(text); }
    return node;
  }
  function put(id, text) { document.getElementById(id).textContent = text; }
  function ok(project, name) {
    var block = (project.signals || {})[name] || {};
    return block.quality === "ok" ? block : null;
  }
  // Rounded once, in Python, and read back here. An audit found
  // `quiet 11d ago` in this column beside `quiet for 10 days` in the
  // next: recency_days was 10.5, this rounded up and the state sentence
  // truncated down. Two answers to one question, produced by arithmetic
  // rather than by design - so the page no longer does its own rounding.
  function age(days, display) {
    if (days === null || days === undefined) { return t("unit.none"); }
    if (days < 1) { return t("unit.today"); }
    return (display === null || display === undefined
            ? Math.round(days) : display) + t("unit.days_ago");
  }
  // Counts read "label: 4", not "4 labels". English plurals and Chinese
  // measure words disagree about where the number goes and about whether
  // the noun changes at all; putting the label first is the one form
  // that is correct in both without a pluralisation engine.
  function count(key, value) { return t(key) + ": " + value; }

  function head() {
    put("brand", t("board.title"));
    put("tagline", t("board.tagline"));
    put("promise", t("board.promise"));
    put("projects-title", t("board.projects"));
    put("notes-title", t("board.problems"));
    var providers = (board.providers || []).map(function (p) { return p.name; });
    put("meta",
      t("board.generated") + " " + (board.generated_at || "?") + "  ·  " +
      t("board.home") + " " + (board.home || "?") + "  ·  " +
      t("board.locale") + " " + (board.locale || "?") + "  ·  " +
      t("board.providers") + " " +
      (providers.length ? providers.join(", ") : t("board.providers_none")));

    var stats = board.stats || {};
    var tiles = document.getElementById("tiles");
    [["projects", "stat.projects", false],
     ["active", "stat.active", false],
     ["in_hand", "stat.in_hand", true],
     ["unsent", "stat.unsent", true],
     ["owed", "stat.owed", true],
     ["degraded", "stat.degraded", true]].forEach(function (spec) {
      var value = stats[spec[0]] || 0;
      // A number here is only honest when nothing went unmatched. An
      // alias that exists but never matches is not the same as knowing
      // that nobody is waiting on you.
      // Three cases, because there are three different truths and the
      // first version collapsed them into two. `blind` denies that
      // anything matched, so it may only be shown when nothing did - it
      // used to appear alongside `owed > 0`, contradicting the two rows
      // below it that carried `names you, per the ledger`. When some
      // matched and some did not, the number stands and the shortfall is
      // named beside it.
      var unmatched = stats.owner_unmatched || 0;
      var blind = (spec[0] === "owed" && value === 0
                   && (unmatched > 0 || !stats.owner_aliases));
      var partial = (spec[0] === "owed" && value > 0 && unmatched > 0);
      var tile = el("div", "tile" + (spec[2] && value > 0 ? " alert" : ""));
      tile.appendChild(el("b", null, blind ? "\u2013" : value));
      tile.appendChild(el("span", null, t(spec[1])));
      if (blind) {
        tile.appendChild(el("span", "why", t("stat.owed_blind")));
        tile.title = t("stat.owed_blind");
      } else if (partial) {
        var note = t("stat.owed_partial").replace("{count}", unmatched);
        tile.appendChild(el("span", "why", note));
        tile.title = note;
      }
      tiles.appendChild(tile);
    });

    var problems = board.problems || [];
    (board.projects || []).forEach(function (project) {
      (project.problems || []).forEach(function (line) {
        problems.push(project.name + ": " + line);
      });
    });
    if (problems.length) {
      document.getElementById("notes-section").hidden = false;
      var list = document.getElementById("notes");
      problems.forEach(function (line) { list.appendChild(el("li", null, line)); });
    }
  }

  function cellProject(project) {
    var cell = el("td");
    cell.appendChild(el("span", "pname", project.name || project.id));
    cell.appendChild(el("span", "proot", project.root || ""));
    if (project.sensitive) { cell.appendChild(el("span", "chip", t("label.sensitive"))); }
    // DP47. The write guard's boundary and this project's directory
    // overlap, so the guard alone no longer proves the red line. It says
    // so here, on the board, and not only in the run's log.
    if (project.home_overlap) {
      cell.appendChild(el("span", "chip q-degraded", t("label.overlap")));
    }
    var stack = ok(project, "stack");
    if (stack) {
      stack.labels.forEach(function (label) { cell.appendChild(el("span", "chip", label)); });
    }
    var tag = ok(project, "tag");
    if (tag) { cell.appendChild(el("span", "chip", t("label.tag") + " " + tag.name)); }
    if (project.git === false) { cell.appendChild(el("span", "chip", t("label.not_git"))); }
    return cell;
  }

  function cellActivity(project) {
    var cell = el("td");
    var tier = project.tier || "UNKNOWN";
    cell.appendChild(el("span", "chip t-" + tier, t("tier." + tier)));
    cell.appendChild(el("span", "num", age(project.recency_days, project.recency_days_display)));
    // DP22/DP23: the activity clock's answer, as a second and weaker line
    // under the commit clock, never as the tier. The hint at the foot of
    // this page promised exactly this line and nothing rendered it - the
    // clock could be switched on and the extra signal appeared nowhere.
    var clock = project.activity;
    if (clock && clock.age_days !== undefined && clock.age_days !== null) {
      cell.appendChild(el("span", "num quiet",
        t("activity.touched").replace("{days}", Math.round(clock.age_days))));
    }
    var trend = ok(project, "trend");
    if (trend) {
      cell.appendChild(el("span", "num quiet", t("trend." + trend.direction)));
      cell.appendChild(el("span", "num quiet",
        count("unit.commits_window", trend.commits)));
    }
    var last = ok(project, "last_commit");
    if (last && last.subject) { cell.appendChild(el("span", "subject", last.subject)); }
    var tree = ok(project, "tree");
    if (tree && !last) {
      cell.appendChild(el("span", "subject", t("label.newest_file") + ": " + tree.path));
    }
    return cell;
  }

  function cellState(project) {
    var cell = el("td");
    var st = project.state;
    if (!st) { return cell; }
    var wrap = el("span", "state " + (st.css_class || ""));

    wrap.appendChild(el("span", "chip", t("state." + st.kind.replace("-", "_"))));
    if (st.owner) { wrap.appendChild(el("span", "owed", t("state.owner_queue"))); }

    var body = el("span", "body", st.text || "");
    // The badge sits after the sentence, where the eye lands last, and
    // only ever on an inference. Between it and the dashed rule, a guess
    // says twice over that it is a guess - and it never borrows the
    // solid rule a quotation from the project's own ledger gets.
    if (st.kind === "inferred") { body.appendChild(el("span", "badge", st.badge)); }
    wrap.appendChild(body);

    if (st.kind === "declared") {
      var line = st.source + (st.line ? ":" + st.line : "") +
                 (st.marker ? "  " + t("label.marker") + " " + st.marker : "");
      wrap.appendChild(el("span", "why", line));
      if (st.stale) { wrap.appendChild(el("span", "why stale", t("state.stale")
        .replace("{days}", (board.method && board.method.numbers
          ? board.method.numbers.declaration_stale_days : 14)))); }
    }
    if (st.kind === "curated" && st.byline) {
      wrap.appendChild(el("span", "why", st.byline));
    }
    if (st.kind === "inferred") {
      wrap.appendChild(el("span", "why",
        t("state.evidence") + ": " + (st.evidence || []).join(" \u00b7 ")));
    }
    // Every kind that has one, not only an inference (DP80). A declaration
    // outranks the whole inference table, so a row quoting "waiting on the
    // vendor" showed that alone while the tile above counted it among the
    // ones holding uncommitted work - the fact joining the two sentences
    // was on neither. The list is empty for a row with nothing in hand,
    // and an empty list appends nothing: no stray bullet, no blank line.
    // Placed between the evidence line and the promote line so an inferred
    // row reads in exactly the order it did before.
    (st.also || []).forEach(function (line) {
      wrap.appendChild(el("span", "why", t("state.also") + ": " + line));
    });
    if (st.kind === "inferred") {
      wrap.appendChild(el("span", "why", t("state.promote") + ": " + st.promote));
    }
    if (st.kind === "no-source") {
      wrap.appendChild(el("span", "why", st.next_command));
    }
    cell.appendChild(wrap);
    return cell;
  }

  function cellInHand(project) {
    var cell = el("td");
    // `changed.files` rather than `changed`: the block is present with a
    // quality of ok whenever the tree was read, so this printed
    // "uncommitted: 0" and "unpushed: 0" in the in-hand cell of every
    // clean repository. Nothing in hand is what an empty cell says.
    var changed = ok(project, "uncommitted");
    if (changed && changed.files) {
      cell.appendChild(el("span", "num", count("unit.uncommitted", changed.files)));
    }
    var unpushed = ok(project, "unpushed");
    if (unpushed && unpushed.commits) {
      cell.appendChild(el("span", "num", count("unit.unpushed", unpushed.commits)));
    } else if (project.git &&
               ((project.signals || {}).unpushed || {}).quality === "not-applicable") {
      cell.appendChild(el("span", "num quiet", t("label.no_upstream")));
    }
    var stash = ok(project, "stash");
    if (stash && stash.entries) {
      cell.appendChild(el("span", "num", count("unit.stash", stash.entries)));
    }
    var last = ok(project, "last_commit");
    if (last && last.wip) { cell.appendChild(el("span", "chip q-degraded", t("label.wip"))); }
    var branches = ok(project, "branches");
    if (branches) {
      cell.appendChild(el("span", "num quiet", count("unit.branches", branches.count)));
      if (branches.behind) {
        cell.appendChild(el("span", "num quiet", count("unit.behind", branches.behind)));
      }
    }
    return cell;
  }

  function cellBacklog(project) {
    var cell = el("td");
    var todos = ok(project, "todos");
    if (todos) {
      cell.appendChild(el("span", "num", count("unit.todos", todos.unchecked)));
    }
    var markers = ok(project, "code_markers");
    if (markers) {
      cell.appendChild(el("span", "num quiet", count("unit.markers", markers.total)));
    }
    return cell;
  }

  function cellMaturity(project) {
    var cell = el("td");
    var maturity = ok(project, "maturity");
    if (!maturity) { return cell; }
    ["readme", "license", "ci", "tests"].forEach(function (key) {
      if (maturity[key]) { cell.appendChild(el("span", "chip", t("maturity." + key))); }
    });
    return cell;
  }

  function cellSignals(project) {
    var cell = el("td");
    var quality = project.signal_quality || "bad";
    cell.appendChild(el("span", "chip q-" + quality, t("quality." + quality)));
    (project.degraded || []).forEach(function (item) {
      var label = item.signal + " " + t("signal." + item.quality);
      cell.appendChild(el("span", "num quiet", label));
    });
    return cell;
  }

  function rows() {
    var headRow = document.getElementById("thead");
    ["col.project", "col.activity", "col.state", "col.in_hand",
     "col.backlog", "col.maturity", "col.signals"].forEach(function (key) {
      headRow.appendChild(el("th", null, t(key)));
    });
    var body = document.getElementById("rows");
    var projects = board.projects || [];
    put("projects-count", projects.length + " " + t("stat.projects"));
    if (!projects.length) {
      var empty = el("tr");
      var cell = el("td", null, t("board.empty"));
      cell.colSpan = 7;
      empty.appendChild(cell);
      body.appendChild(empty);
      return;
    }
    projects.forEach(function (project) {
      var row = el("tr", project.tier === "MISSING" ? "miss" : null);
      [cellProject, cellActivity, cellState, cellInHand,
       cellBacklog, cellMaturity, cellSignals].forEach(function (build) {
        row.appendChild(build(project));
      });
      body.appendChild(row);
    });
  }

  function boardHints() {
    var block = board.hints || {};
    put("hints-title", block.title || "");
    var host = document.getElementById("hints-lines");
    if (!host) { return; }
    (block.lines || []).forEach(function (line) {
      var p = document.createElement("p");
      p.textContent = line;
      host.appendChild(p);
    });
  }

  function method() {
    var block = board.method || {};
    put("method-title", block.title || "");
    var host = document.getElementById("method-lines");
    (block.lines || []).forEach(function (line) {
      host.appendChild(el("p", null, line));
    });
  }

  if (!window.MURSCOPE_BOARD) {
    document.getElementById("tagline").textContent =
      "data.js did not load. It should sit beside this file; re-run murscope.";
    return;
  }
  head();
  rows();
  method();
  boardHints();
})();
</script>
</body>
</html>
